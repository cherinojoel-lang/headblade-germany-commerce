name: CI

on:
  push:
    branches: [feat/astro-headblade-premium]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin stable npm resolver
        run: npm install --global npm@11.6.0
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type and Astro check
        run: npm run check
      - name: Full test suite
        run: npm test
      - name: Static production build
        run: npm run build
      - name: Enforce preview safety contract
        run: npm run validate:preview
