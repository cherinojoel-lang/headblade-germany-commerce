name: CI
on:
  push:
    branches: [feat/astro-headblade-premium]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm away from Arborist edgesOut regression
        run: npm install --global npm@11.6.0
      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm install --no-audit --no-fund
      - name: Preview and catalog contracts
        run: npm test -- test/preview.test.ts test/catalog.test.ts
      - name: Astro check
        run: npm run check
      - name: Static build
        run: npm run build
