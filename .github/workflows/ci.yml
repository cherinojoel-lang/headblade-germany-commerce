name: CI
on:
  push:
    branches: [feat/astro-headblade-premium]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose dependency install
        run: |
          node --version
          npm --version
          npm config get registry
          npm install --no-audit --no-fund --verbose || {
            echo '=== npm debug log ==='
            cat /home/runner/.npm/_logs/*-debug-0.log || true
            exit 1
          }
      - run: npm test -- test/preview.test.ts
