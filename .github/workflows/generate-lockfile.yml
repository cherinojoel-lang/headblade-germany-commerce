name: Generate Package Lock

on:
  push:
    branches: [feat/astro-headblade-premium]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/astro-headblade-premium
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin stable npm resolver
        run: npm install --global npm@11.6.0
      - name: Generate deterministic package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package lock when changed
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate package lock"
          git push origin HEAD:feat/astro-headblade-premium
