name: Deploy Review Preview

on:
  push:
    branches: [feat/astro-headblade-premium]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require Cloudflare review credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 2; }
      - name: Pin stable npm resolver
        run: npm install --global npm@11.6.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify review safety before upload
        run: npm run verify
      - name: Deploy isolated review Worker
        run: npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
      - name: Print verified public review URL
        run: |
          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -1 || true)
          test -n "$URL" || { echo "Wrangler did not return a workers.dev URL"; exit 3; }
          echo "HEADBLADE_PREVIEW_URL=$URL"
